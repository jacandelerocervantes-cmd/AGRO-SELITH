[project]
name = "selith-agro"
version = "0.1.0"
description = "Sistema de apoyo a la decisión para rotación de cultivos y milpa (piloto Tizimín, Yucatán)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "earthaccess>=0.19.0",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.2",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "pyyaml>=6.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/engine/src"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "tests/knowledge", "apps/api/tests", "pipelines/tests"]
pythonpath = ["tools", "packages/engine/src", "pipelines", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501", "E402"]  # E402: ajustes de sys.path en config/pruebas
