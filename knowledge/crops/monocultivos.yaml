      agua_mm_ciclo: {valor: 600, unidad: mm/ciclo, <<: *prov}
      tolerancia_sequia: {valor: 2, unidad: "escala 1-5", <<: *prov}
      sensibilidad_canicula: {valor: 0.8, unidad: "índice 0-1", <<: *prov}
      ingreso_ref_mxn_ha: {valor: 40000, unidad: MXN/ha, <<: *prov}
      n_aporte_kg_ha: {valor: -30, unidad: kg N/ha, <<: *prov}
      mo_aporte: {valor: -0.1, unidad: "índice relativo", <<: *prov}
    utilidades:
      agua_eficiencia: {valor: 0.3, <<: *idx}
      fijacion_n: {valor: 0.0, <<: *idx}
      materia_organica: {valor: 0.2, <<: *idx}
      control_erosion: {valor: 0.3, <<: *idx}
      infiltracion: {valor: 0.4, <<: *idx}
      ruptura_plagas: {valor: 0.5, <<: *idx}
      valor_forrajero: {valor: 0.0, <<: *idx}
      estabilidad_ingreso: {valor: 0.3, <<: *idx}
