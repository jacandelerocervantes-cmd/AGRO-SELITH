      agua_mm_ciclo: {valor: 320, unidad: mm/ciclo, <<: *prov}
      tolerancia_sequia: {valor: 3, unidad: "escala 1-5", <<: *prov}
      sensibilidad_canicula: {valor: 0.7, unidad: "índice 0-1", <<: *prov}
      ingreso_ref_mxn_ha: {valor: 8000, unidad: MXN/ha, <<: *prov}
      n_aporte_kg_ha: {valor: 30, unidad: kg N/ha, <<: *prov}
      mo_aporte: {valor: 0.3, unidad: "índice relativo", <<: *prov}
    utilidades:
      agua_eficiencia: {valor: 0.6, <<: *idx}
      fijacion_n: {valor: 0.7, <<: *idx}
      materia_organica: {valor: 0.5, <<: *idx}
      control_erosion: {valor: 0.5, <<: *idx}
      infiltracion: {valor: 0.5, <<: *idx}
      ruptura_plagas: {valor: 0.7, <<: *idx}
      valor_forrajero: {valor: 0.4, <<: *idx}
      estabilidad_ingreso: {valor: 0.4, <<: *idx}

  - id: chile_habanero
    nombre: Chile habanero
    tipo: [monocultivo, hortaliza]
    familias: [solanaceae]
    hospedantes: [virus_solanaceas]
    es_barbecho: false
    es_barbecho_desnudo: false
